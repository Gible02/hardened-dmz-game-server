# =============================================================
# Minecraft Bedrock Dedicated Server — security-relevant settings
# Host      : Windows 11, C:\McServer\
# Build doc : docs/07-host-hardening.md
# Full file : this is an excerpt. Only settings with a security
#             or exposure consequence are documented here.
# =============================================================

server-port=19132
server-portv6=19133          # not forwarded at the ISP gateway

# --- authentication and access ---
online-mode=true             # Xbox Live auth enforced. C-08.
                             # Requires outbound reachability to Microsoft auth
                             # endpoints — see the C-03 egress note in the risk register.
allow-list=true              # only gamertags in allowlist.json are admitted
max-players=5                # bounds resource consumption
allow-cheats=false           # no command access for connected players

# --- world ---
gamemode=survival
difficulty=normal
force-gamemode=false

# --- exposure reduction (outstanding) ---
enable-lan-visibility=<FILL: set false>
                             # LAN broadcast discovery is unnecessary for an
                             # internet-facing server and is a small
                             # fingerprinting surface

# --- telemetry ---
# emit-server-telemetry not enabled
